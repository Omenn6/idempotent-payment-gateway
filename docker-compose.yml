services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  migration-runner:
    build: .
    command: alembic upgrade head
    depends_on:
      postgres_db:
        condition: service_healthy

  candidate-service:
    build: .
    container_name: candidate-service
    environment:
      - PROVIDER_URL=http://provider-simulator:8081
      - DB_HOST=postgres_db
    ports:
      - "8080:8080"
    volumes:
      - candidate-data:/data
    depends_on:
      postgres_db:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
    container_name: provider-simulator
    environment:
      - CALLBACK_URL=http://candidate-service:8080/receipts
    ports:
      - "8081:8081"
    volumes:
      - candidate-data:/data
    depends_on:
      - candidate-service

volumes:
  pg-data:
  candidate-data: