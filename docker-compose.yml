services:
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: payment_gateway
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    entrypoint: >
      sh -c "
      echo 'CREATE DATABASE test_payment_gateway;' > /docker-entrypoint-initdb.d/init-test-db.sql &&
      exec /usr/local/bin/docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-payment_gateway}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  migration-runner:
    build: .
    command: alembic upgrade head
    environment:
      DB_HOST: "postgres_db"
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres_password
      DB_NAME: payment_gateway
    depends_on:
      postgres_db:
        condition: service_healthy

  candidate-service:
    build: .
    container_name: candidate-service
    environment:
      PROVIDER_URL: "http://provider-simulator:8081"
      DB_HOST: "postgres_db"
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres_password
      DB_NAME: payment_gateway
    ports:
      - "8080:8080"
    volumes:
      - candidate-data:/data
    depends_on:
      postgres_db:
        condition: service_healthy
      migration-runner:
        condition: service_completed_successfully

  provider-simulator:
    image: ghcr.io/fintech-dev-lab/internship-provider-simulator:v0.2.0
    container_name: provider-simulator
    environment:
      CALLBACK_URL: "http://candidate-service:8080/receipts"
    ports:
      - "8081:8081"
    depends_on:
      - candidate-service

volumes:
  pg-data:
  candidate-data: